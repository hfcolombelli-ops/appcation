# Deploy automático: Flutter Web → Firebase Hosting (projeto appcation)
#
# Secrets obrigatório no repositório (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT  → JSON completo da conta de serviço (ver README em baixo)
#
# Opcional:
#   API_BASE_URL              → URL da API Laravel (sem barra final).
#                               Se vazio, usa https://appcation-production.up.railway.app
#
# Firebase Web (build Flutter; se FIREBASE_WEB_PROJECT_ID estiver vazio, Firebase Web fica omitido no bundle):
#   FIREBASE_WEB_API_KEY, FIREBASE_WEB_APP_ID, FIREBASE_WEB_MESSAGING_SENDER_ID,
#   FIREBASE_WEB_PROJECT_ID, FIREBASE_WEB_AUTH_DOMAIN, FIREBASE_WEB_STORAGE_BUCKET,
#   FIREBASE_WEB_MEASUREMENT_ID (opcional)
#
name: Deploy Web (Firebase Hosting)

on:
  push:
    branches:
      - main
    paths:
      - 'Frontend/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-web-hosting.yml'
  workflow_dispatch:

permissions:
  contents: read

# Sem cancelar run em andamento: o download do Flutter na 1ª vez demora e um 2º push
# costumava matar o job no meio ("The operation was canceled"). Novos commits ficam em fila.
concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: false

env:
  FIREBASE_PROJECT: appcation
  API_BASE_URL_FALLBACK: https://appcation-production.up.railway.app
  # GitHub Actions: acções JS legacy (ex. Firebase deploy) correm em Node 24 em vez de 20 deprecado.
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Flutter SDK (stable)
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
          cache: true
          cache-sdk: true

      - name: Dependencies
        working-directory: Frontend
        run: flutter pub get

      - name: Analyze (Dart)
        working-directory: Frontend
        run: dart analyze

      - name: Test (Flutter)
        working-directory: Frontend
        run: flutter test

      # URL via ficheiro (--dart-define-from-file): evita que caracteres no secret
      # (aspas, newline, espaços) partam as aspas do bash e o Flutter trate
      # "--dart-define=..." como ficheiro alvo ("Target file ... not found").
      - name: Build web
        working-directory: Frontend
        env:
          API_FOR_BUILD: ${{ secrets.API_BASE_URL || env.API_BASE_URL_FALLBACK }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_WEB_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_WEB_MESSAGING_SENDER_ID }}
          FIREBASE_WEB_PROJECT_ID: ${{ secrets.FIREBASE_WEB_PROJECT_ID }}
          FIREBASE_WEB_AUTH_DOMAIN: ${{ secrets.FIREBASE_WEB_AUTH_DOMAIN }}
          FIREBASE_WEB_STORAGE_BUCKET: ${{ secrets.FIREBASE_WEB_STORAGE_BUCKET }}
          FIREBASE_WEB_MEASUREMENT_ID: ${{ secrets.FIREBASE_WEB_MEASUREMENT_ID }}
        run: |
          set -euo pipefail
          url="$(printf '%s' "$API_FOR_BUILD" | head -n1 | tr -d '\r')"
          defs="$(mktemp)"
          printf '%s\n' "API_BASE_URL=${url}" >"$defs"
          if [ -n "${FIREBASE_WEB_PROJECT_ID:-}" ]; then
            {
              printf '%s\n' "FIREBASE_WEB_API_KEY=${FIREBASE_WEB_API_KEY}"
              printf '%s\n' "FIREBASE_WEB_APP_ID=${FIREBASE_WEB_APP_ID}"
              printf '%s\n' "FIREBASE_WEB_MESSAGING_SENDER_ID=${FIREBASE_WEB_MESSAGING_SENDER_ID}"
              printf '%s\n' "FIREBASE_WEB_PROJECT_ID=${FIREBASE_WEB_PROJECT_ID}"
              printf '%s\n' "FIREBASE_WEB_AUTH_DOMAIN=${FIREBASE_WEB_AUTH_DOMAIN}"
              printf '%s\n' "FIREBASE_WEB_STORAGE_BUCKET=${FIREBASE_WEB_STORAGE_BUCKET}"
            } >>"$defs"
            if [ -n "${FIREBASE_WEB_MEASUREMENT_ID:-}" ]; then
              printf '%s\n' "FIREBASE_WEB_MEASUREMENT_ID=${FIREBASE_WEB_MEASUREMENT_ID}" >>"$defs"
            fi
          fi
          flutter build web --release --no-wasm-dry-run --dart-define-from-file="$defs"
          rm -f "$defs"

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0.10.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT }}
          channelId: live
