# PostgreSQL local para desenvolvimento (alinhado a produção no Railway).
#
# Só Postgres:
#   cd Backend && docker compose up -d
#
# Postgres + pgAdmin (http://localhost:5050):
#   cd Backend && docker compose --profile tools up -d
#
# No .env: DB_CONNECTION=pgsql e DB_URL conforme Backend/.env.example
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: appcation
      POSTGRES_PASSWORD: appcation
      POSTGRES_DB: appcation
    volumes:
      - appcation_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appcation -d appcation"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Interface web para gerir a base local (http://localhost:5050).
  # Login: PGADMIN_DEFAULT_EMAIL / PGADMIN_DEFAULT_PASSWORD abaixo.
  # Ao registar servidor no pgAdmin: Host "postgres", porta 5432, DB appcation.
  pgadmin:
    image: dpage/pgadmin4:8.14
    profiles:
      - tools
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@appcation.local
      PGADMIN_DEFAULT_PASSWORD: appcation
      PGADMIN_CONFIG_SERVER_MODE: "False"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  appcation_pgdata:
